name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: pharmacy_chain_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: pharmacy_chain_test
      JWT_SECRET: ci_jwt_secret_at_least_32_characters_long_xx
      JWT_EXPIRES_IN: 12h
      BCRYPT_ROUNDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: ./backend
        run: npm ci
      - name: Format check
        working-directory: ./backend
        run: npm run format:check
      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 --silent; then
              echo "MariaDB is ready"; break
            fi
            echo "Waiting for MariaDB..."; sleep 2
          done
      - name: Migrate + seed
        working-directory: ./backend
        run: |
          npm run migrate
          npm run seed
      - name: Test
        working-directory: ./backend
        run: npm test

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Format check
        working-directory: ./frontend
        run: npm run format:check
      - name: Test
        working-directory: ./frontend
        run: npm test -- --run
      - name: Build
        working-directory: ./frontend
        run: npm run build
